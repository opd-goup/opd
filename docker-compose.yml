version: '3.8'

services:
  # Контейнер с PHP и Apache для запуска Yii2
  web:
    image: yiisoftware/yii2-php:8.3-apache
    container_name: yii2_web
    ports:
      - "8080:80"
    volumes:
      - ./:/app
    environment:
      - PHP_ENABLE_XDEBUG=0
    depends_on:
      - db
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: yii2_phpmyadmin
    restart: always
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: root
    depends_on:
      - db

  # Контейнер для Базы Данных (MySQL)
  db:
    image: mysql:8.0
    container_name: yii2_db
    restart: always
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: restaurant_db
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - db_data:/var/lib/mysql
      - ./db.sql:/docker-entrypoint-initdb.d/init.sql 

volumes:
  db_data:
